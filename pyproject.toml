[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bases"
version = "0.4.0"
description = "Dots and Boxes with a Q-learning opponent, pygame GUI and training tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pyyaml>=6.0", "pygame>=2.5"]

[project.scripts]
bases = "bases.cli:main"

[tool.setuptools]
packages = ["bases"]
